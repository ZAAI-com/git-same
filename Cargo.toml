[package]
name = "git-same"
version = "0.2.0"
edition = "2021"
authors = ["Git-Same Contributors"]
description = "Mirror GitHub org/repo structure locally - supports multiple providers"
license = "MIT"
repository = "https://github.com/zaai-com/git-same"
keywords = ["git", "github", "cli", "clone", "sync"]
categories = ["command-line-utilities", "development-tools"]

# All binaries are installed by default
[[bin]]
name = "git-same"
path = "src/main.rs"

[[bin]]
name = "gitsame"
path = "src/main.rs"

[[bin]]
name = "gitsa"
path = "src/main.rs"

[[bin]]
name = "gisa"
path = "src/main.rs"

[features]
default = []

[dependencies]
# CLI parsing
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for GitHub API
reqwest = { version = "0.12", features = ["json"] }

# JSON/TOML serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Progress bars and terminal output
indicatif = "0.17"
console = "0.15"

# XDG directories (~/.config/git-same)
directories = "5"

# Error handling
thiserror = "1"
anyhow = "1"

# Shell expansion (~/ paths)
shellexpand = "3"

# Async trait support
async-trait = "0.1"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Futures utilities
futures = "0.3"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Testing
tokio-test = "0.4"
mockito = "1"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
