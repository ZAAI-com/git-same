[workspace]
members = [
    "crates/git-same-core",
    "crates/git-same-cli",
    "crates/git-same-app",
]
resolver = "2"

[workspace.package]
version = "3.1.0"
edition = "2021"
authors = ["Git-Same Contributors"]
license = "MIT"
repository = "https://github.com/zaai-com/git-same"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
indicatif = "0.18"
console = "0.16"
directories = "6"
thiserror = "2"
anyhow = "1"
shellexpand = "3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.30"
crossterm = "0.29"
clap_complete = "4"
clap_mangen = "0.3"
tokio-test = "0.4"
mockito = "1"
tempfile = "3"
notify = "6"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
