name: GitSameBadge

options:
  bundleIdPrefix: com.zaai.git-same
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is intentionally blank: set it in Xcode
    # Signing & Capabilities, or via `xcodebuild DEVELOPMENT_TEAM=XXXXXXXXXX`.
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    PRODUCT_NAME: $(TARGET_NAME)

targets:
  GitSameBadge:
    type: application
    platform: macOS
    sources:
      - path: GitSameBadge
      - path: Shared
    info:
      path: GitSameBadge/Info.plist
      properties:
        CFBundleDisplayName: GitSameBadge
        CFBundleIdentifier: com.zaai.git-same.GitSameBadge
        CFBundleName: GitSameBadge
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "13.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaai.git-same.GitSameBadge
        CODE_SIGN_ENTITLEMENTS: GitSameBadge/GitSameBadge.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../PlugIns"
        SWIFT_OBJC_BRIDGING_HEADER: ""
    dependencies:
      - target: GitSameBadgeSync

  GitSameBadgeSync:
    type: app-extension
    platform: macOS
    sources:
      - path: GitSameBadgeSync
      - path: Shared
    info:
      path: GitSameBadgeSync/Info.plist
      properties:
        CFBundleDisplayName: GitSameBadge Sync
        CFBundleIdentifier: com.zaai.git-same.GitSameBadge.FinderSync
        CFBundleName: GitSameBadgeSync
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.FinderSync
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).FinderSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zaai.git-same.GitSameBadge.FinderSync
        CODE_SIGN_ENTITLEMENTS: GitSameBadgeSync/GitSameBadgeSync.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
        SKIP_INSTALL: YES
