name: S1 - Test CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust-no-bin

      # The workspace includes the Tauri app crate (git-same-app, Tauri 2.11),
      # so `clippy/test --workspace` builds its Linux backend (webkit2gtk-4.1 +
      # gtk-3 + soup3). macOS (WebKit) and Windows (WebView2) need nothing extra.
      - name: Install Tauri Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Check formatting
        run: cargo +${{ matrix.rust }} fmt --all -- --check

      - name: Clippy
        run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        # --no-fail-fast so a failure in one crate's test binary still runs the
        # rest, surfacing every platform-specific failure in a single CI run.
        run: cargo +${{ matrix.rust }} test --workspace --all-features --no-fail-fast -- --test-threads=1

  build:
    name: Build (${{ matrix.target }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust-no-bin

      - name: Build release
        run: cargo +stable build --release -p git-same --target ${{ matrix.target }}

  tauri-debug-build:
    name: Tauri App Debug Build
    needs: [test]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        # Activate the pnpm version pinned in crates/git-same-app/ui/package.json
        # (packageManager: pnpm@11.0.9). Newer corepack defaults to a different
        # pnpm (11.9.0) and refuses to self-switch, so pin it for every corepack
        # invocation, including the tauri.conf.json beforeBuildCommand.
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.0.9 --activate

      - name: Verify entitlements parity
        run: bash toolkit/packaging/macos/check-entitlements-parity.sh

      - name: Install frontend dependencies
        run: pnpm --dir crates/git-same-app/ui install --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir crates/git-same-app/ui build

      - name: Build Tauri app binary
        run: |
          cd crates/git-same-app
          ui/node_modules/.bin/tauri build --debug --no-bundle

  coverage:
    name: Code Coverage
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust-no-bin

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2.85.6
        with:
          tool: cargo-tarpaulin

      - name: Clean before coverage
        run: cargo clean

      - name: Generate coverage
        run: cargo +stable tarpaulin --all-features --workspace --timeout 120 --out xml --engine llvm

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          fail_ci_if_error: false

  alias-drift-check:
    name: Alias Drift Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify alias manifest and consumers
        run: |
          set -e

          # Manifests exist
          for f in \
            toolkit/packaging/binary-aliases.txt \
            toolkit/packaging/targets.txt \
            toolkit/packaging/tarball-manifest.txt; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f not found"; exit 1
            fi
            if [ ! -s "$f" ]; then
              echo "ERROR: $f is empty"; exit 1
            fi
          done

          # Exactly 1 default [[bin]] in Cargo.toml. [[bin]] entries gated by
          # `required-features` (e.g. release-tools helpers gen-completions and
          # gen-manpage) are excluded — they don't ship in normal builds.
          read DEFAULT_COUNT CARGO_BIN <<<"$(awk '
            function flush() {
              if (in_bin && !has_req) {
                default_count++
                if (name != "" && default_name == "") default_name = name
              }
            }
            /^\[\[bin\]\]/ { flush(); in_bin=1; name=""; has_req=0; next }
            in_bin && /^\[/ { flush(); in_bin=0 }
            in_bin && /^[[:space:]]*name[[:space:]]*=/ {
              line=$0; sub(/^[^"]*"/, "", line); sub(/".*$/, "", line); name=line
            }
            in_bin && /^[[:space:]]*required-features[[:space:]]*=/ { has_req=1 }
            END { flush(); print default_count, default_name }
          ' crates/git-same-cli/Cargo.toml)"
          if [ "${DEFAULT_COUNT:-0}" -ne 1 ]; then
            echo "ERROR: Cargo.toml has ${DEFAULT_COUNT:-0} default [[bin]] entries, expected 1"; exit 1
          fi
          if [ -z "${CARGO_BIN:-}" ]; then
            echo "ERROR: Could not resolve default bin name from Cargo.toml"; exit 1
          fi

          # Primary matches Cargo.toml default bin name
          MANIFEST_PRIMARY=$(head -n1 toolkit/packaging/binary-aliases.txt)
          if [ "$MANIFEST_PRIMARY" != "$CARGO_BIN" ]; then
            echo "ERROR: Primary mismatch: manifest=$MANIFEST_PRIMARY cargo=$CARGO_BIN"; exit 1
          fi

          # Homebrew workflow + cask/formula templates reference all aliases
          HOMEBREW_FILES=(
            .github/workflows/S3-Publish-Homebrew.yml
            toolkit/homebrew/cask.rb.tmpl
            toolkit/homebrew/formula-cli.rb.tmpl
            toolkit/homebrew/render-cask.sh
            toolkit/homebrew/render-formula.sh
          )
          for f in "${HOMEBREW_FILES[@]}"; do
            [ -f "$f" ] || { echo "ERROR: required Homebrew file not found: $f"; exit 1; }
          done
          while IFS= read -r alias; do
            [ -z "$alias" ] && continue
            found=0
            for f in "${HOMEBREW_FILES[@]}"; do
              if grep -Fq -- "$alias" "$f"; then
                found=1; break
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "ERROR: '$alias' not referenced in any Homebrew file"; exit 1
            fi
          done < toolkit/packaging/binary-aliases.txt

          # Conductor script paths exist with exact casing (important on Linux)
          [ -f toolkit/conductor/run.sh ] || { echo "ERROR: toolkit/conductor/run.sh not found"; exit 1; }
          [ -f toolkit/conductor/archive.sh ] || { echo "ERROR: toolkit/conductor/archive.sh not found"; exit 1; }

          # Scripts reference the manifest
          grep -q 'binary-aliases.txt' toolkit/conductor/run.sh || { echo "ERROR: run.sh missing manifest ref"; exit 1; }
          grep -q 'binary-aliases.txt' toolkit/conductor/archive.sh || { echo "ERROR: archive.sh missing manifest ref"; exit 1; }

          echo "All alias drift checks passed."

  workflow-secret-safety:
    name: Workflow Secret Safety
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Block known secret-leak patterns in workflows
        run: |
          set -euo pipefail

          # Prevent credentials embedded in URLs (high leak risk in logs/config).
          if grep -RInE 'https://[^/@[:space:]]+@github[.]com' .github/workflows; then
            echo "ERROR: Credential-in-URL pattern found in workflow files."
            exit 1
          fi

          # Prevent direct printing of expressions that evaluate from secrets.
          if grep -RInE 'echo[[:space:]].*\$\{\{[[:space:]]*secrets\.' .github/workflows; then
            echo "ERROR: Direct echo of secrets expression found in workflow files."
            exit 1
          fi

          # Prevent shell xtrace in workflow scripts.
          if grep -RInE '(^|[[:space:];])set[[:space:]]+-[a-wyzA-WYZ]*x|bash[[:space:]]+-[a-wyzA-WYZ]*x' .github/workflows; then
            echo "ERROR: Shell xtrace detected in workflow files."
            exit 1
          fi

  audit:
    name: Security Audit
    runs-on: macos-latest
    # audit-check creates a check run with annotations, which needs checks:write
    # on top of the workflow-wide contents:read default.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Transitive advisories with no patched release, all pulled in by the
          # Tauri app crate's Linux backend (gtk-rs 0.18 + glib), its proc-macro
          # tooling, and the unic-* unicode crates. Real vulnerabilities are not
          # ignored: quinn-proto and anyhow were fixed by bumping Cargo.lock.
          ignore: RUSTSEC-2024-0370,RUSTSEC-2024-0411,RUSTSEC-2024-0412,RUSTSEC-2024-0413,RUSTSEC-2024-0414,RUSTSEC-2024-0415,RUSTSEC-2024-0416,RUSTSEC-2024-0417,RUSTSEC-2024-0418,RUSTSEC-2024-0419,RUSTSEC-2024-0420,RUSTSEC-2024-0429,RUSTSEC-2025-0075,RUSTSEC-2025-0080,RUSTSEC-2025-0081,RUSTSEC-2025-0098,RUSTSEC-2025-0100
