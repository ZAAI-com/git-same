name: S4 - Publish Crates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., 3.1.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  SPARSE_INDEX_BASE: https://index.crates.io/gi/t-

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        id: rel
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must be strict semver only, no leading zeros (e.g., 3.0.1). Got: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.rel.outputs.tag }}
          persist-credentials: false

      - name: Verify tag matches workspace version
        env:
          VERSION: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          MANIFEST_VERSION=$(awk -F'"' '/^version *=/ {print $2; exit}' Cargo.toml)
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "Tag $VERSION does not match workspace version $MANIFEST_VERSION" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Publish steps skip crates already in the sparse index so the workflow
      # can be re-dispatched after a partial failure (publishes are immutable).
      - name: Publish git-same-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          if curl -fsS "${SPARSE_INDEX_BASE}/git-same-core" | grep "\"vers\":\"${VERSION}\"" >/dev/null; then
            echo "git-same-core ${VERSION} already on crates.io; skipping."
          else
            cargo +stable publish -p git-same-core
          fi

      # Poll the sparse index (what cargo resolves dependencies from), not
      # `cargo search`: the search index updates asynchronously and can lag
      # a publish by well over five minutes.
      - name: Wait for crates.io to index git-same-core
        env:
          VERSION: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Waiting for git-same-core ${VERSION} in the sparse index..."
          for _ in $(seq 1 30); do
            if curl -fsS "${SPARSE_INDEX_BASE}/git-same-core" | grep "\"vers\":\"${VERSION}\"" >/dev/null; then
              echo "Indexed."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for git-same-core ${VERSION} in the sparse index" >&2
          exit 1

      - name: Publish git-same
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          if curl -fsS "${SPARSE_INDEX_BASE}/git-same" | grep "\"vers\":\"${VERSION}\"" >/dev/null; then
            echo "git-same ${VERSION} already on crates.io; skipping."
          else
            cargo +stable publish -p git-same
          fi
