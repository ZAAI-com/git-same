name: S2 - Release GitHub

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust-no-bin

      - name: Check formatting
        run: cargo +${{ matrix.rust }} fmt --all -- --check

      - name: Clippy
        run: cargo +${{ matrix.rust }} clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo +${{ matrix.rust }} test --workspace --all-features -- --test-threads=1

  coverage:
    name: Code Coverage
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust-no-bin

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Clean before coverage
        run: cargo clean

      - name: Generate coverage
        run: cargo +stable tarpaulin --all-features --workspace --timeout 120 --out xml --engine llvm

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          fail_ci_if_error: false

  alias-drift-check:
    name: Alias Drift Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify alias manifest and consumers
        run: |
          set -e

          # Manifest exists
          if [ ! -f toolkit/packaging/binary-aliases.txt ]; then
            echo "ERROR: toolkit/packaging/binary-aliases.txt not found"; exit 1
          fi

          # Exactly 1 default [[bin]] in Cargo.toml. [[bin]] entries gated by
          # `required-features` (e.g. release-tools helpers gen-completions and
          # gen-manpage) are excluded — they don't ship in normal builds.
          read DEFAULT_COUNT CARGO_BIN <<<"$(awk '
            function flush() {
              if (in_bin && !has_req) {
                default_count++
                if (name != "" && default_name == "") default_name = name
              }
            }
            /^\[\[bin\]\]/ { flush(); in_bin=1; name=""; has_req=0; next }
            in_bin && /^\[/ { flush(); in_bin=0 }
            in_bin && /^[[:space:]]*name[[:space:]]*=/ {
              line=$0; sub(/^[^"]*"/, "", line); sub(/".*$/, "", line); name=line
            }
            in_bin && /^[[:space:]]*required-features[[:space:]]*=/ { has_req=1 }
            END { flush(); print default_count, default_name }
          ' crates/git-same-cli/Cargo.toml)"
          if [ "${DEFAULT_COUNT:-0}" -ne 1 ]; then
            echo "ERROR: Cargo.toml has ${DEFAULT_COUNT:-0} default [[bin]] entries, expected 1"; exit 1
          fi
          if [ -z "${CARGO_BIN:-}" ]; then
            echo "ERROR: Could not resolve default bin name from Cargo.toml"; exit 1
          fi

          # Primary matches Cargo.toml default bin name
          MANIFEST_PRIMARY=$(head -n1 toolkit/packaging/binary-aliases.txt)
          if [ "$MANIFEST_PRIMARY" != "$CARGO_BIN" ]; then
            echo "ERROR: Primary mismatch: manifest=$MANIFEST_PRIMARY cargo=$CARGO_BIN"; exit 1
          fi

          # Homebrew workflow + cask/formula templates reference all aliases
          HOMEBREW_FILES=(
            .github/workflows/S3-Publish-Homebrew.yml
            toolkit/homebrew/cask.rb.tmpl
            toolkit/homebrew/formula-cli.rb.tmpl
            toolkit/homebrew/render-cask.sh
            toolkit/homebrew/render-formula.sh
          )
          for f in "${HOMEBREW_FILES[@]}"; do
            [ -f "$f" ] || { echo "ERROR: required Homebrew file not found: $f"; exit 1; }
          done
          while IFS= read -r alias; do
            [ -z "$alias" ] && continue
            found=0
            for f in "${HOMEBREW_FILES[@]}"; do
              if grep -Fq -- "$alias" "$f"; then
                found=1; break
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "ERROR: '$alias' not referenced in any Homebrew file"; exit 1
            fi
          done < toolkit/packaging/binary-aliases.txt

          # Conductor script paths exist with exact casing (important on Linux)
          [ -f toolkit/conductor/run.sh ] || { echo "ERROR: toolkit/conductor/run.sh not found"; exit 1; }
          [ -f toolkit/conductor/archive.sh ] || { echo "ERROR: toolkit/conductor/archive.sh not found"; exit 1; }

          # Scripts reference the manifest
          grep -q 'binary-aliases.txt' toolkit/conductor/run.sh || { echo "ERROR: run.sh missing manifest ref"; exit 1; }
          grep -q 'binary-aliases.txt' toolkit/conductor/archive.sh || { echo "ERROR: archive.sh missing manifest ref"; exit 1; }

          echo "All alias drift checks passed."

  audit:
    name: Security Audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  workflow-secret-safety:
    name: Workflow Secret Safety
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Block known secret-leak patterns in workflows
        run: |
          set -euo pipefail

          # Prevent credentials embedded in URLs (high leak risk in logs/config).
          if grep -RInE 'https://[^/@[:space:]]+@github[.]com' .github/workflows; then
            echo "ERROR: Credential-in-URL pattern found in workflow files."
            exit 1
          fi

          # Prevent direct printing of expressions that evaluate from secrets.
          if grep -RInE 'echo[[:space:]].*\$\{\{[[:space:]]*secrets\.' .github/workflows; then
            echo "ERROR: Direct echo of secrets expression found in workflow files."
            exit 1
          fi

          # Prevent shell xtrace in workflow scripts.
          if grep -RInE '(^|[[:space:];])set[[:space:]]+-[a-wyzA-WYZ]*x|bash[[:space:]]+-[a-wyzA-WYZ]*x' .github/workflows; then
            echo "ERROR: Shell xtrace detected in workflow files."
            exit 1
          fi

  prepare-matrix:
    name: Prepare Build Matrix from targets.txt
    needs: [test, coverage, alias-drift-check, audit, workflow-secret-safety]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: set
        shell: bash
        run: |
          set -euo pipefail
          # Map each Rust target triple in toolkit/packaging/targets.txt to
          # a GitHub Actions runner. Adding a new triple to targets.txt without
          # a runner mapping below is a hard failure here, by design.
          runner_for() {
            case "$1" in
              x86_64-unknown-linux-gnu)  echo ubuntu-latest ;;
              aarch64-unknown-linux-gnu) echo ubuntu-24.04-arm ;;
              x86_64-apple-darwin)       echo macos-latest ;;
              aarch64-apple-darwin)      echo macos-latest ;;
              *) echo "ERROR: no runner mapping for target '$1'" >&2; exit 1 ;;
            esac
          }
          ENTRIES=()
          while IFS= read -r target; do
            [ -z "$target" ] && continue
            os="$(runner_for "$target")"
            ENTRIES+=("{\"target\":\"${target}\",\"os\":\"${os}\"}")
          done < toolkit/packaging/targets.txt
          if [ ${#ENTRIES[@]} -eq 0 ]; then
            echo "ERROR: no targets parsed from toolkit/packaging/targets.txt" >&2
            exit 1
          fi
          ( IFS=,; echo "matrix=[${ENTRIES[*]}]" ) >> "$GITHUB_OUTPUT"

  build-release-assets:
    name: Build Release Asset (${{ matrix.target }})
    needs: [prepare-matrix]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          prefix-key: v1-rust-no-bin

      - name: Build
        run: cargo +stable build --release -p git-same --target ${{ matrix.target }}

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release builds require a strict semver tag ref. Got: $TAG" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compute asset names
        if: startsWith(github.ref, 'refs/tags/')
        id: asset
        shell: bash
        run: |
          NAME="git-same-${{ steps.version.outputs.version }}-${{ matrix.target }}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "tarball=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "shafile=${NAME}.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Generate shell completions
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash toolkit/packaging/gen-completions.sh staging

      - name: Generate manpage
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: bash toolkit/packaging/gen-manpage.sh staging

      - name: Stage binary + LICENSE
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/git-same staging/git-same
          cp LICENSE staging/LICENSE

      - name: Tar and SHA (Linux)
        if: runner.os != 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          ( cd staging && tar -czf "../${{ steps.asset.outputs.tarball }}" -- * )
          shasum -a 256 "${{ steps.asset.outputs.tarball }}" \
            | awk '{print $1}' > "${{ steps.asset.outputs.shafile }}"

      - name: Sign, notarize, and tar (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          APPLE_DEVELOPER_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          bash toolkit/packaging/darwin-sign-and-notarize.sh \
            staging/git-same \
            "${{ matrix.target }}" \
            "${{ steps.version.outputs.version }}" \
            . \
            --entitlements toolkit/packaging/darwin-entitlements.plist

      - name: Verify tarball contents match manifest
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(sort toolkit/packaging/tarball-manifest.txt | grep -v '^$')"
          ACTUAL="$(tar -tzf "${{ steps.asset.outputs.tarball }}" \
                    | sed -e 's|^\./||' \
                    | grep -v '^$' \
                    | grep -v '/$' \
                    | sort)"
          if ! diff <(printf '%s\n' "$EXPECTED") <(printf '%s\n' "$ACTUAL"); then
            echo "ERROR: tarball contents do not match toolkit/packaging/tarball-manifest.txt" >&2
            exit 1
          fi

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.asset.outputs.tarball }}
          path: |
            ${{ steps.asset.outputs.tarball }}
            ${{ steps.asset.outputs.shafile }}

  build-app-assets:
    name: Build macOS App DMG (${{ matrix.arch }})
    needs: [test, coverage, alias-drift-check, audit, workflow-secret-safety]
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release builds require a strict semver tag ref. Got: $TAG" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Verify entitlements parity
        run: bash toolkit/packaging/macos/check-entitlements-parity.sh

      - name: Build signed app DMG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          WORKSPACE_ROOT: ${{ github.workspace }}
          OUTPUT_DIR: ${{ github.workspace }}/dist/macos
          # Releases always embed the FinderSync extension; there is
          # intentionally no per-run toggle for the DMG in the release path.
          INCLUDE_FINDER_EXTENSION: '1'
          APPLE_DEVELOPER_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12 }}
          APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: bash toolkit/packaging/macos/build-app-bundle.sh

      - name: Upload app artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: git-same-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
          path: |
            dist/macos/git-same-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg
            dist/macos/git-same-${{ steps.version.outputs.version }}-${{ matrix.arch }}.dmg.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-release-assets, build-app-assets]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Require tag in semantic version format
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! [[ "$TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must be strict semver only, no leading zeros (e.g., 1.0.0). Got: $TAG"
            exit 1
          fi

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;

      - name: Create/update release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
